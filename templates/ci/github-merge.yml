# Installed by flow-setup as .github/workflows/flow-merge.yml.
# pull_request_target runs THIS file and the flow scripts from the base branch, never from the pull request,
# so a pull request cannot change the code that judges it. The pull request's files are read as data, never run.
# Merges made with GITHUB_TOKEN do not start push workflows: deploy with a GitHub App token or on workflow_run.
name: flow-merge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: flow-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'flow/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: origin/${{ github.event.pull_request.base.ref }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch the pull request as data
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/flow/pr-head"
      - name: Review verdict is present, passing and fresh
        run: node scripts/flow/verdict.js ci "$BASE" --branch "$BRANCH" --head refs/flow/pr-head
      - name: Task diff size
        run: node scripts/flow/gates.js diff --base "$BASE" --head refs/flow/pr-head
      - name: Required CI results
        run: node scripts/flow/check-ci.js "$PR" --wait-seconds 1800
      # Merges unless the diff touches merge.high_risk_paths or the guardrails; then labels needs-human-merge.
      - name: Merge by risk
        run: node scripts/flow/merge.js run "$PR" || [ $? -eq 10 ]
