# Installed by flow-setup as .github/workflows/flow-gates.yml.
# These checks run on EVERY pull request, whether or not an agent ran them locally.
# Flow-managed merges check named CI results with check-ci.js; GitHub branch rules are optional.
name: flow-gates
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # runs the flow scripts; not your project's toolchain
      # >>> flow-init inserts your stack's setup steps here (python, go, jdk, pnpm install, docker, ...)
      - name: Validate flow.config.yaml
        run: node scripts/flow/doctor.js --ci
      - name: Target gates (lint, typecheck, tests, build)
        run: |
          for tag in $(node -e "import('./scripts/flow/lib/config.js').then(m=>console.log(m.loadConfig().cfg.targets.map(t=>t.tag).join(' ')))"); do
            node scripts/flow/gates.js run --target "$tag" || exit 1
          done
      - name: Task diff size
        if: github.event_name == 'pull_request'
        run: node scripts/flow/gates.js diff --base "origin/${{ github.base_ref }}"
      - name: Review verdict is present, passing and fresh
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'flow/')
        run: node scripts/flow/verdict.js ci "origin/${{ github.base_ref }}"

  auto-merge:
    needs: gates
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'flow/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Auto-merges unless the diff touches merge.high_risk_paths (or the guardrails themselves);
      # in that case labels the PR needs-human-merge and leaves it for a person.
      - name: Check required CI results
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/flow/check-ci.js "${{ github.event.pull_request.number }}" --wait-seconds 1800
      - name: Merge by risk
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/flow/merge.js run "${{ github.event.pull_request.number }}" || [ $? -eq 10 ]
