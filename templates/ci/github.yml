# Installed by flow-setup as .github/workflows/flow-gates.yml.
# Runs the pull request's own code with a read-only token: config, target gates, and the test-first proof.
# Judging the review and merging happen in flow-merge.yml, which runs only base-branch code.
name: flow-gates
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # runs the flow scripts; not your project's toolchain
      # >>> flow-init inserts your stack's setup steps here (python, go, jdk, pnpm install, docker, ...)
      - name: Validate flow.config.yaml
        run: node scripts/flow/doctor.js --ci
      - name: Target gates (lint, typecheck, tests, build)
        run: |
          for tag in $(node -e "import('./scripts/flow/lib/config.js').then(m=>console.log(m.loadConfig().cfg.targets.map(t=>t.tag).join(' ')))"); do
            node scripts/flow/gates.js run --target "$tag" || exit 1
          done
      - name: Test-first commits really reproduce the problem
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'flow/')
        run: node scripts/flow/gates.js testfirst --base "origin/${{ github.base_ref }}" --prove --optional
