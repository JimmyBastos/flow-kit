# Hub CI validates the shared flow documents. Target repositories run their own code gates.
name: flow-gates
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate flow configuration
        run: node scripts/flow/doctor.js --ci
      - name: Validate flow documents
        run: node scripts/flow/gates.js docs
