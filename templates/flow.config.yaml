# flow.config.yaml, written by /flow-init. Subset-YAML only (the scripts have no dependencies):
# 2-space indent, no anchors, no multi-line strings.
topology: single            # single | monorepo | multi
flow_dir: .flow             # path to the shared flow folder, relative to this config file
targets:
  - tag: app                # tag used in plan-<tag>.md and in tasks ("[app]")
    path: .                 # or: remote: git@host:org/repo.git
    gates: ["__lint__", "__typecheck__", "__test__", "__build__"]   # cheapest first; commands, any stack
    # e2e: "__start-stack-and-run-blackbox-checks__"                # optional, run by flow-review
tracker: none               # linear | github-issues | none
workspace: git-worktree     # git-worktree | orca
fallback: unavailable       # try the next candidate only if the harness or model is unavailable
capabilities:               # ordered candidates; tasks request capabilities, not models
  planning:                 # intake, spec, plans, tasks, drift classification
    candidates:
      - { harness: auto, model: default }
      - { harness: auto, model: default }
  research:                 # investigation led by a strong model; reading goes to subagents
    candidates:
      - { harness: auto, model: default }
    subagent_candidates:    # smaller models for read-only search (--subagent); same harness as the leader
      - { harness: auto, model: default }
  implementation:           # one task, test first, on its own branch
    candidates:
      - { harness: auto, model: default }
      - { harness: auto, model: default }
    retry_candidates:       # used after a failed review (flow-run passes --retry); declared, never silent
      - { harness: auto, model: default }
  review:                   # independent diff review against rules and invariants
    prefer_different_harness: true
    candidates:
      - { harness: auto, model: default }
      - { harness: auto, model: default }
model_policy:                # optional provider rules; adapters exclude candidates that fail them
  providers: {}
limits:
  max_attempts_per_task: 3
  max_task_diff_lines: 300   # changed code lines per task; test files are reported, not counted
  max_spec_lines: 60
  max_plan_lines: 60
merge:
  auto: true                # auto-merge a PR that passed every gate, unless it touches a path below
  required_checks: ["flow-gates / gates"]
  high_risk_paths: ["**/migrations/**", "**/auth/**", ".github/**", "infra/**"]
# diff_exempt_globs: ["**/migration/**/snapshot.json"]   # generated files that do not count toward the diff cap, such as ORM migration snapshots
# test_globs: ["**/*.test.*", "**/tests/**"]   # what counts as a test file for the test-first check
