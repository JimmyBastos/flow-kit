topology: multi
flow_dir: .flow
targets:
  - tag: api
    path: ../api
    gates: ["node --test"]
  - tag: app
    path: ../app
    gates: ["node --test"]
tracker: none
capabilities:
  planning:
    candidates:
      - harness: claude-code
        model: opus
  repository_exploration:
    candidates:
      - harness: claude-code
        model: haiku
  implementation:
    candidates:
      - harness: claude-code
        model: sonnet
  review:
    prefer_different_harness: true
    candidates:
      - harness: opencode
        model: opencode-go/glm-5.3
