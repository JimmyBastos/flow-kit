topology: single
flow_dir: .flow
targets:
  - tag: app
    path: .
    gates: ["node --test"]
tracker: none
capabilities:
  planning:
    candidates:
      - harness: claude-code
        model: opus
  repository_exploration:
    candidates:
      - harness: claude-code
        model: haiku
  implementation:
    candidates:
      - harness: claude-code
        model: sonnet
  review:
    prefer_different_harness: true
    candidates:
      - harness: codex
        model: gpt
