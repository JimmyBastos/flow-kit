topology: monorepo
flow_dir: .flow
targets:
  - tag: a
    path: packages/a
    gates: ["node --test"]
  - tag: b
    path: packages/b
    gates: ["node --test"]
tracker: none
capabilities:
  reasoning:
    candidates:
      - harness: claude-code
        model: opus
        context_window: 200000
  repository_exploration:
    candidates:
      - harness: claude-code
        model: haiku
        context_window: 200000
  implementation:
    candidates:
      - harness: claude-code
        model: sonnet
        context_window: 200000
  review:
    prefer_different_harness: true
    candidates:
      - harness: codex
        model: gpt
        context_window: 200000
