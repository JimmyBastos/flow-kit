topology: monorepo
flow_dir: .flow
targets:
  - tag: a
    path: packages/a
    gates: ["node --test"]
  - tag: b
    path: packages/b
    gates: ["node --test"]
tracker: none
capabilities:
  planning:
    candidates:
      - harness: claude-code
        model: opus
  research:
    candidates:
      - harness: claude-code
        model: opus
    subagent_candidates:
      - harness: claude-code
        model: haiku
  implementation:
    candidates:
      - harness: claude-code
        model: sonnet
  review:
    prefer_different_harness: true
    candidates:
      - harness: codex
        model: gpt
