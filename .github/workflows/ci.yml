# CI for flow-kit itself: unit and end-to-end tests for flow.js, and the kit lint (skills reference only real files).
# Practice what the kit installs in projects: make "test" a required status check
# on main (Settings -> Branches -> Require status checks), and block force pushes.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # vitest needs Node 22.12+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - name: Tests
        run: npm test
